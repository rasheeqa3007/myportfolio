<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowCert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#certBg)" />
  
  <!-- Certificate frame -->
  <rect x="180" y="70" width="240" height="190" rx="12" fill="#0b1329" stroke="url(#cyanGrad)" stroke-width="2" />
  <rect x="195" y="85" width="210" height="160" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />
  
  <!-- Shield emblem -->
  <path d="M300 115 L320 125 V150 C320 165 300 175 300 175 C300 175 280 165 280 150 V125 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glowCert)" />
  <path d="M293 145 L298 150 L308 140" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <line x1="220" y1="195" x2="380" y2="195" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="240" y1="210" x2="360" y2="210" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  
  <!-- Badge -->
  <rect x="200" y="280" width="200" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1" />
  <text x="300" y="299" fill="#06b6d4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">VERIFICATION SYSTEM</text>
</svg>
