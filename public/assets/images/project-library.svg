<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09132e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgGrad2)" />
  
  <!-- Grid Matrix -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="40" x2="550" y2="40" />
    <line x1="50" y1="100" x2="550" y2="100" />
    <line x1="50" y1="160" x2="550" y2="160" />
    <line x1="50" y1="220" x2="550" y2="220" />
    <line x1="50" y1="280" x2="550" y2="280" />
    <line x1="120" y1="20" x2="120" y2="340" />
    <line x1="240" y1="20" x2="240" y2="340" />
    <line x1="360" y1="20" x2="360" y2="340" />
    <line x1="480" y1="20" x2="480" y2="340" />
  </g>
  
  <!-- Digital Bookshelf / Nodes -->
  <rect x="180" y="90" width="240" height="150" rx="12" fill="#0f172a" stroke="url(#javaGrad)" stroke-width="2" filter="url(#glow2)" />
  
  <!-- Book spine graphics -->
  <rect x="210" y="115" width="22" height="95" rx="4" fill="#38bdf8" opacity="0.9" />
  <rect x="240" y="105" width="22" height="105" rx="4" fill="#818cf8" opacity="0.9" />
  <rect x="270" y="125" width="22" height="85" rx="4" fill="#c084fc" opacity="0.9" />
  <rect x="300" y="110" width="22" height="100" rx="4" fill="#38bdf8" opacity="0.8" />
  <rect x="330" y="118" width="22" height="92" rx="4" fill="#818cf8" opacity="0.8" />
  <rect x="360" y="100" width="22" height="110" rx="4" fill="#c084fc" opacity="0.8" />
  
  <!-- Data circulation arrows -->
  <path d="M140 165 L170 165" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="172,165 164,160 164,170" fill="#38bdf8" />
  <path d="M430 165 L460 165" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="462,165 454,160 454,170" fill="#818cf8" />
  
  <!-- Badge -->
  <rect x="220" y="270" width="160" height="28" rx="14" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1" />
  <text x="300" y="289" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">JAVA OOP ARCHITECTURE</text>
</svg>
