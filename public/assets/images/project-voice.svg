<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2c" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)" />
  <circle cx="300" cy="180" r="110" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3" />
  <circle cx="300" cy="180" r="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 6" opacity="0.2" />
  
  <!-- Soundwaves -->
  <path d="M120 180 Q165 140 210 180 T300 180 T390 180 T480 180" stroke="url(#waveGrad)" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M140 180 Q180 120 220 180 T300 180 T380 180 T460 180" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M160 180 Q200 100 240 180 T300 180 T360 180 T440 180" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8" />
  
  <!-- Central AI Core Microphone -->
  <circle cx="300" cy="180" r="42" fill="#0f172a" stroke="url(#waveGrad)" stroke-width="3" filter="url(#glow)" />
  <rect x="292" y="162" width="16" height="26" rx="8" fill="#38bdf8" />
  <path d="M284 175 C284 190 316 190 316 175" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <line x1="300" y1="193" x2="300" y2="202" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="292" y1="202" x2="308" y2="202" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Badges -->
  <rect x="230" y="270" width="140" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="300" y="289" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">NLP &amp; MULTILINGUAL</text>
</svg>
